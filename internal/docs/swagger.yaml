info:
  contact: {}
paths:
  /api/async/actions:
    get:
      consumes:
      - application/json
      description: return list of supported actions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      tags:
      - async
  /api/async/message:
    post:
      consumes:
      - application/json
      description: send new message to browser
      parameters:
      - description: browser message
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.BrowserMessageIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.BrowserMessageOut'
      security:
      - Bearer: []
      tags:
      - async
  /api/async/sessions:
    get:
      consumes:
      - application/json
      description: returns active sessions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_internal_sessions.ActiveSession'
            type: array
      security:
      - Bearer: []
      tags:
      - async
  /api/async/sessions/active:
    get:
      consumes:
      - application/json
      description: checks if session is active
      parameters:
      - description: sessionID to check
        example: 61c135fa-b604-4ff8-bebc-aefee8155219
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_internal_sessions.IsActive'
      security:
      - Bearer: []
      tags:
      - async
  /api/async/sessions/cleanup:
    post:
      consumes:
      - application/json
      description: cleans up expired sessions
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - Bearer: []
      tags:
      - async
  /api/async/start:
    post:
      consumes:
      - application/json
      description: start browser async session for async interactions
      parameters:
      - description: run config
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.Config'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.Result'
      security:
      - Bearer: []
      tags:
      - async
  /api/async/stop:
    post:
      consumes:
      - application/json
      description: stop browser async session
      parameters:
      - description: run config
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.ControlConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.BrowserMessageOut'
      security:
      - Bearer: []
      tags:
      - async
  /api/docs:
    get:
      consumes:
      - application/json
      description: returns documentation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_service.Docs'
      tags:
      - docs
  /api/eke-extract:
    post:
      consumes:
      - multipart/form-data
      description: process a binary file uploaded directly (multipart/form-data) and
        return readable content.
      parameters:
      - description: binary file bytes
        in: formData
        name: file
        required: true
        type: file
      - description: MIME type of the file
        in: formData
        name: mimeType
        required: true
        type: string
      - description: pandoc output format (e.g. markdown)
        in: formData
        name: returnPandoc
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.ReadabilityResult'
      security:
      - Bearer: []
      tags:
      - run
  /api/extract-markdown:
    post:
      consumes:
      - application/json
      description: extracts markdown from a document by its URL.
      parameters:
      - description: run config
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.ReadabilityConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.ExtractMarkdownResult'
      security:
      - Bearer: []
      tags:
      - run
  /api/parse:
    post:
      consumes:
      - application/json
      description: parses document by its URL and returns the parsed document.
      parameters:
      - description: run config
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.ReadabilityConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.ParseDocResult'
      security:
      - Bearer: []
      tags:
      - run
  /api/parse-to-markdown-kv:
    post:
      consumes:
      - application/json
      description: 'Parses documents (Excel: XLSX/XLSM/XLSB/XLS/XLTX/XLTM/XLT, Word:
        DOCX/DOC, PowerPoint: PPTX/PPT, CSV, TXT) and returns standard Markdown. For
        Excel files, each sheet becomes a separate section with ## heading.'
      parameters:
      - description: parse config
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.ReadabilityConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ursa-Minor-Beta_baas_pkg_dto.ParseToMarkdownResult'
      security:
      - Bearer: []
      tags:
      - parse
  /api/pdf-to-images:
    post:
      consumes:
      - application/json
      description: converts PDF document by its URL to images and returns the URLs
        of the images.
      parameters:
      - description: run config
        in: body
        name: data
